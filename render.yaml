services:
  - type: web
    name: diabevidence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1
      # Similarity floor for retrieval abstention — tuned empirically by
      # scripts/tune_threshold.py, see data/threshold_sweep.csv. Not a
      # secret; override here (or in Render's dashboard) if re-tuning.
      - key: SIMILARITY_FLOOR
        value: "0.50"
